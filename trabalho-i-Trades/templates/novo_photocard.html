{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h3 class="text-center fw-bold mb-4">
                        Anunciar Photocard
                    </h3>

                    <form method="POST" enctype="multipart/form-data">

                        <!-- NOME -->
                        <div class="mb-3">
                            <input
                                name="nome"
                                class="form-control"
                                placeholder="Nome do photocard"
                                required>
                        </div>

                        <!-- GRUPO -->
                        <div class="mb-3">
                            <input
                                name="grupo"
                                class="form-control"
                                placeholder="Grupo"
                                required>
                        </div>

                        <!-- PREÇO -->
                        <div class="mb-3">
                            <input
                                name="preco"
                                class="form-control"
                                placeholder="Preço"
                                required>
                        </div>

                        <!-- DESCRIÇÃO -->
                        <div class="mb-3">
                            <input
                                name="descricao"
                                class="form-control"
                                placeholder="Descrição"
                                required>
                        </div>

                        <!-- TIPO -->
                        <div class="mb-3">
                            <label class="form-label">Tipo de anúncio</label>

                            <select name="tipo_anuncio" class="form-select">

                                <option value="venda">Venda</option>
                                <option value="troca">Troca</option>
                                <option value="ambos">Venda / Troca</option>

                            </select>
                        </div>

                        <!-- IMAGEM -->
                        <div class="mb-3">
                            <label class="form-label">Imagem</label>

                            <input
                                type="file"
                                name="imagem"
                                class="form-control"
                                accept="image/*">
                        </div>

                        <!-- BOTÃO -->
                        <button type="submit" class="btn btn-success w-100">
                            Publicar
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
