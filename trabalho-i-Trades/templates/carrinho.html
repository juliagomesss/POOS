{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <h2 class="text-center fw-bold mb-4">
        Seu Carrinho
    </h2>

    {% if cards %}

    <form method="POST" action="/checkout">

        <div class="row g-4">

            {% for card in cards %}

            <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                <div class="position-relative">

                    <input
                        type="checkbox"
                        name="selecionados"
                        value="{{card.id}}"
                        class="form-check-input position-absolute top-0 end-0 m-2"
                        style="transform: scale(1.3);">

                    <a href="/produto/{{card.id}}"
                       class="text-decoration-none text-dark">

                        <div class="photocard h-100 shadow-sm">

                            {% if card.imagem %}
                            <img src="{{ url_for('static', filename='uploads/' + card.imagem) }}"
                                 style="height: 220px; width: 100%; object-fit: cover;">
                            {% else %}
                            <div class="bg-secondary" style="height: 220px;"></div>
                            {% endif %}

                            <div class="p-3">

                                <h5 class="fw-bold">{{ card.nome }}</h5>

                                <p class="mb-1 text-muted">
                                    {{ card.grupo }}
                                </p>

                                <span class="fw-bold text-success">
                                    {{ card.preco }}
                                </span>

                            </div>

                        </div>

                    </a>

                </div>

            </div>

            {% endfor %}

        </div>

        <!-- AÇÕES -->
        <div class="d-flex flex-wrap justify-content-center gap-3 mt-4">

            <button type="button"
                    class="btn btn-outline-secondary"
                    onclick="selecionarTodos()">
                Selecionar todos
            </button>

            <button type="submit"
                    class="btn btn-success">
                Comprar selecionados
            </button>

            <button type="button"
                    class="btn btn-danger"
                    onclick="removerSelecionados()">
                Excluir selecionados
            </button>

        </div>

    </form>

    <!-- FORM OCULTO -->
    <form id="removerForm" method="POST" action="/remover_selecionados"></form>

    {% else %}

    <p class="text-center text-muted py-5">
        Seu carrinho está vazio.
    </p>

    {% endif %}

</div>

<script>

function selecionarTodos() {
    document.querySelectorAll(".form-check-input")
        .forEach(c => c.checked = true);
}

function removerSelecionados() {

    let checks = document.querySelectorAll(".form-check-input:checked");
    let form = document.getElementById("removerForm");

    form.innerHTML = "";

    checks.forEach(c => {
        let input = document.createElement("input");
        input.type = "hidden";
        input.name = "selecionados";
        input.value = c.value;
        form.appendChild(input);
    });

    form.submit();
}

</script>

{% endblock %}
