{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <h2 class="text-center fw-bold mb-4">
        Meus Anúncios
    </h2>

    <div class="row g-4 justify-content-center">

        {% for card in cards %}

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">

            <div class="card shadow-sm h-100">

                <!-- LINK PRODUTO -->
                <a href="/produto/{{ card.id }}" class="text-decoration-none text-dark">

                    {% if card.imagem %}
                    <img src="{{ url_for('static', filename='uploads/' + card.imagem) }}"
                         class="card-img-top"
                         style="height: 220px; object-fit: cover;">
                    {% else %}
                    <div class="bg-secondary" style="height: 220px;"></div>
                    {% endif %}

                    <div class="card-body">

                        <h5 class="card-title">{{ card.nome }}</h5>

                        <p class="text-muted mb-1">{{ card.grupo }}</p>

                        <span class="fw-bold text-success">
                            R$ {{ card.preco }}
                        </span>

                    </div>

                </a>

                <!-- AÇÕES -->
                <div class="card-footer bg-white border-0 d-flex gap-2">

                    <a href="/editar_photocard/{{ card.id }}"
                       class="btn btn-sm btn-outline-primary w-50">
                        Editar
                    </a>

                    <a href="/excluir_photocard/{{ card.id }}"
                       class="btn btn-sm btn-outline-danger w-50">
                        Excluir
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
