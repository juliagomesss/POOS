{% extends 'base.html' %}

{% block content %}

<form method="POST" class="card p-4 shadow-sm mx-auto" style="max-width:400px;">

    <h3 class="mb-3">Login</h3>

    {% if erro %}
    <p class="text-danger">{{ erro }}</p>
    {% endif %}

    <input class="form-control mb-2" type="text" name="user" placeholder="Usuário">
    <input class="form-control mb-3" type="password" name="senha" placeholder="Senha">

    <button class="btn btn-primary w-100">Entrar</button>

    <p class="mt-3 text-center">
        Não tem conta? <a href="/cadastro">Cadastre-se</a>
    </p>

</form>

{% endblock %}
