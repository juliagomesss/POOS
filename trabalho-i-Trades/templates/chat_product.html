{% extends 'base.html' %}

{% block content %}
<h2 style="text-align:center; margin-top:40px;">Chat — {{ product.nome }} {% if buyer %} (com {{ buyer }}){% endif %}</h2>

<div style="max-width:900px; margin:20px auto;">

    <div class="chat-messages">
        {% if mensagens %}
            {% for m in mensagens %}
            <div class="chat-msg">
                <strong>{{ m.usuario }}</strong>: <span>{{ m.mensagem }}</span>
            </div>
            {% endfor %}
        {% else %}
            <p class="vazio">Nenhuma mensagem ainda.</p>
        {% endif %}
    </div>

    <form method="POST" style="display:flex; gap:8px; margin-top:12px;">
        <input name="mensagem" placeholder="Digite sua mensagem" style="flex:1; padding:10px; border-radius:8px; border:1px solid #e6cfd8;" required>
        <button type="submit" class="chat-send-btn">Enviar</button>
    </form>

</div>

{% endblock %}
