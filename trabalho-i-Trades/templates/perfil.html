{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body text-center p-4">

                    <h3 class="fw-bold mb-4">
                        Perfil
                    </h3>

                    <!-- FOTO -->
                    {% if info.foto_perfil %}
                    <img src="{{ url_for('static', filename='uploads/' + info.foto_perfil) }}"
                         class="rounded-circle mb-3"
                         style="width:120px; height:120px; object-fit:cover;">
                    {% endif %}

                    <!-- INFO -->
                    <p class="mb-1"><strong>Usuário:</strong> {{ usuario }}</p>
                    <p class="mb-1"><strong>Nome:</strong> {{ info.nome }}</p>
                    <p class="mb-1"><strong>Email:</strong> {{ info.email }}</p>
                    <p class="mb-1"><strong>Tipo:</strong> {{ info.tipo }}</p>

                    <hr>

                    <div class="d-flex justify-content-center gap-4 mb-3">

                        <div>
                            <strong>{{ seguindo|length }}</strong><br>
                            <small class="text-muted">Seguindo</small>
                        </div>

                        <div>
                            <strong>{{ seguidores|length }}</strong><br>
                            <small class="text-muted">Seguidores</small>
                        </div>

                    </div>

                    <!-- LOGOUT -->
                    <a href="/logout" class="btn btn-danger w-100">
                        Sair da conta
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
